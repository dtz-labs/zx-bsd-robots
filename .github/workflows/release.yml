name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # Pinned weekly z88dk image: release bytes change only after an explicit bump.
  Z88DK_IMAGE: z88dk/z88dk:20260803@sha256:bee965eedd8211fa3344afcd38ce8c5d3b8318745e2c3c94c49ee9f7c35872f4
  Z88DK_HOME: /opt/z88dk

jobs:
  release:
    name: Publish TAP binaries
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Ensure generated TAPs are not versioned
        run: |
          set -eu
          tracked="$(git ls-files '*.tap' '*.zip')"
          if test -n "$tracked"; then
            echo "Generated TAP/ZIP files must not be committed:" >&2
            printf '%s\n' "$tracked" >&2
            exit 1
          fi

      - name: Run host unit tests
        run: make test-host

      - name: Build both TAPs with pinned z88dk
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD":/src -w /src "$Z88DK_IMAGE" \
            make all Z88DK_HOME="$Z88DK_HOME"

      - name: Validate TAPs and memory layouts
        run: make check-layout check-tap

      - name: Stage release files
        run: |
          set -eu
          mkdir -p _release
          cp build/zx-bsd-robots-48k.tap _release/zx-bsd-robots-48k.tap
          cp build/zx-bsd-robots-timex-512.tap \
            _release/zx-bsd-robots-timex-512.tap
          cp LICENSE _release/LICENSE.txt
          cp LICENSES/Clarified-Artistic.txt \
            _release/Clarified-Artistic.txt
          cp THIRD_PARTY_NOTICES.txt _release/THIRD_PARTY_NOTICES.txt
          cd _release
          sha256sum \
            zx-bsd-robots-48k.tap \
            zx-bsd-robots-timex-512.tap \
            LICENSE.txt \
            Clarified-Artistic.txt \
            THIRD_PARTY_NOTICES.txt > SHA256SUMS.txt
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 6
          sha256sum --check SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          release_files=(
            _release/zx-bsd-robots-48k.tap
            _release/zx-bsd-robots-timex-512.tap
            _release/LICENSE.txt
            _release/Clarified-Artistic.txt
            _release/THIRD_PARTY_NOTICES.txt
            _release/SHA256SUMS.txt
          )

          if gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${release_files[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${release_files[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "ZX BSD Robots $GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi
